name: Update volatility scorecard

on:
  schedule:
    # 23:10 UTC on weekdays, after the US market close (25 min after update-paper).
    # Scheduled runs often land hours late. That is fine as long as the run
    # finishes before the next open: a forecast generated after it is marked late.
    - cron: "10 23 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance==1.8.0 pandas==3.1.1 numpy==2.5.4

      - name: Forecast the next trading day and grade earlier forecasts in data/vol/
        run: python scripts/update_vol.py

      # Fails the run if data/vol/ lacks a key the page needs (the page hides
      # quietly instead) or if a committed row of the append only files changed.
      # Does nothing and exits 0 while data/vol does not exist.
      - name: Check data/vol schema
        run: python scripts/check_vol_schema.py

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/vol/ does not exist until the run after the close on the Friday before START_DATE
          if [ -d data/vol ]; then
            git add data/vol/
          fi
          if git diff --cached --quiet; then
            echo "No change in volatility scorecard data."
          else
            git commit -m "Update volatility scorecard"
            git pull --rebase origin main
            git push
          fi
