name: Update sector data

on:
  schedule:
    # 22:30 UTC on weekdays, after the US market close
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Pull prices and rebuild data/sectors.json
        run: python scripts/update_sectors.py

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sectors.json
          if git diff --cached --quiet; then
            echo "No change in sector data."
          else
            git commit -m "Update sector data"
            git push
          fi
