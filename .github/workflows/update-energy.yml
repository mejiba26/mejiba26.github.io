name: Update energy data

on:
  schedule:
    # 17:00 UTC on Wednesdays. EIA publishes the Weekly Petroleum Status
    # Report at 10:30 a.m. Eastern, which is 14:30 UTC in summer and 15:30
    # in winter, so this clears the release either way.
    - cron: "0 17 * * 3"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: scripts/update_eia.py is standard library only.

      - name: Pull EIA data and rebuild data/energy.json
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/update_eia.py

      # Scaffolds notes/draft-YYYY-MM-DD.md from the data just written. It
      # will not overwrite a draft that already exists, so a second run on
      # the same day cannot destroy prose written into one.
      - name: Draft this week's note
        run: python scripts/draft_note.py

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # eia_history.json is the five year cache. It is committed so the
          # next run only has to fetch the tail instead of refetching five
          # years of all eight series against a slow API.
          git add data/energy.json data/eia_history.json notes/
          if git diff --cached --quiet; then
            echo "No change in energy data."
          else
            git commit -m "Update energy data and draft this week's note"
            git push
          fi
