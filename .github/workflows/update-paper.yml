name: Update paper trading

on:
  schedule:
    # 22:45 UTC on weekdays, after the US market close (15 min after update-sectors, to avoid a push race)
    - cron: "45 22 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance==1.8.0 pandas==3.1.1

      - name: Process new trading days and update data/paper/
        run: python scripts/paper_trade.py

      # Fails the run if data/paper/ lacks a key the page needs (the page hides
      # quietly instead). Does nothing and exits 0 while data/paper does not exist.
      - name: Check data/paper schema
        run: python scripts/check_paper_schema.py

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/paper/ does not exist until the first run on or after START_DATE
          if [ -d data/paper ]; then
            git add data/paper/
          fi
          if git diff --cached --quiet; then
            echo "No change in paper trading data."
          else
            git commit -m "Update paper trading"
            git pull --rebase origin main
            git push
          fi
