name: Update paper trading

on:
  schedule:
    # 22:45 UTC on weekdays, after the US market close (15 min after update-sectors, to avoid a push race)
    - cron: "45 22 * * 1-5"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Process new trading days and update data/paper/
        run: python scripts/paper_trade.py

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper/
          if git diff --cached --quiet; then
            echo "No change in paper trading data."
          else
            git commit -m "Update paper trading"
            git pull --rebase origin main
            git push
          fi
